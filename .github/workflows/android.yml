name: Build Biverse Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'biverse-offline-android.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check revised source
        id: source
        run: |
          if test -f biverse-offline-android.zip; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo '8bf61aaa8809c80f0d1ca8519208be0ec39b606d29a46bc29707ae5692efbac2  biverse-offline-android.zip' | sha256sum -c -
            unzip -q biverse-offline-android.zip -d source
            test -f source/biverse-guide/android/tools/build.sh
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Upload biverse-offline-android.zip to the repository root to build the self-contained APK.'
          fi
      - uses: actions/setup-java@v4
        if: steps.source.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outputs.ready == 'true'
        with:
          gradle-version: '8.10.2'
      - name: Android SDK and NDK
        if: steps.source.outputs.ready == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build embedded Python, original web app and native llama.cpp
        if: steps.source.outputs.ready == 'true'
        working-directory: source/biverse-guide
        run: bash android/tools/build.sh
      - name: Verify APK signature and offline contents
        if: steps.source.outputs.ready == 'true'
        working-directory: source/biverse-guide
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          ! grep -q 'android.permission.INTERNET' permissions.txt
          unzip -Z1 "$APK" > apk-files.txt
          grep -Fx 'assets/tinyllama-q4.gguf' apk-files.txt
          grep -Fx 'assets/organism.zip' apk-files.txt
          grep -Fx 'lib/arm64-v8a/libbiverse_llama.so' apk-files.txt
          sha256sum "$APK" > Biverse-Offline.sha256
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.ready == 'true'
        with:
          name: Biverse-Offline-ARM64-debug
          path: |
            source/biverse-guide/android/app/build/outputs/apk/debug/app-debug.apk
            source/biverse-guide/Biverse-Offline.sha256
          if-no-files-found: error
